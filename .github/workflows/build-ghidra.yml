name: Build Ghidra

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: ubuntu-latest
            java-distribution: temurin
          - platform: windows-11-arm
            java-distribution: microsoft

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read Ghidra Build Versions
        run: |
          echo "JDK_VER=$(awk -F'=' '$1=="application.java.min" {print $2}' Ghidra/application.properties)" >> $GITHUB_ENV
          echo "GRADLE_VER=$(awk -F'=' '$1=="application.gradle.min" {print $2}' Ghidra/application.properties)" >> $GITHUB_ENV

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: '${{ matrix.java-distribution }}'
          java-version: '${{ env.JDK_VER }}'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '${{ env.GRADLE_VER }}'

      - name: Fetch Dependencies
        run: gradle -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Build Ghidra
        run: gradle buildGhidra --parallel

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-${{ matrix.platform }}
          path: build/dist/*.zip
          if-no-files-found: error
